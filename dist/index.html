<!doctypehtml><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width,inital-scale=1"><title>Cosmic Collapse</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#253b75,#101329 65%);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center}main{width:min(92vw,430px);text-align:center;padding:20px 0}h1{font-size:clamp(30px,8vw,43px);margin:0;color:#78f4ff;text-shadow:0 0 18px #35cfff}p{color:#c6d6ff;margin:8px 0 20px}.status{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.score{background:#29365d;border:1px solid #506ba3;border-radius:12px;padding:10px 16px;font-weight:700}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:10px;background:#192342;border:1px solid #52689b;border-radius:16px;box-shadow:0 0 30px #3457a944}.cell{aspect-ratio:1;border-radius:10px;background:#293354;display:flex;justify-content:center;align-items:center;font-size:clamp(22px,7vw,34px);font-weight:700;color:#fff}.v2{background:#65d9e8;color:#142440}.v4{background:#65d9e8;color:#142e39}.v8{background:#ffd166;color:#382a24}.v16{background:#ff9d66;color:#41251e}.v32{background:#ff739d}.v64{background:#e57cff}.v128{background:#9d8bff}.v256{background:#6e9dff}.v512{background:#65f0e0;color:#17253d}.v1024{font-size:#f7f18a;color:#302a29}.v2048{background:#fff;color:#302a29}.hint{font-size:13px;line-height:1.6;margin-top:15px;color:#b9c9f6}</style><main><h1>COSMIC COLLAPSE</h1><p>Merge the Stars. Create a universe.<div class=stats><div class=score>SCORE: <span id=score>0</span></div><div class=score>BEST: <span id=best>0</span></div></div><div id=board></div><div class=hint>Use arrow keys or W A S D to move<br>Combine matching planets to reach 2048!</div></main><script>const board=document.getElementById("board"),cells=[],tiles=Array(16).fill(0);let score=0,best=Number(localStorage.getItem("cosmicBest")||0);document.getElementById("best").textContent=best;for(let e=0;e<16;e++){const e=document.createElement("div");e.className="cell",board.appendChild(e),cells.push(e)}function spawnTile(){const e=[];for(let t=0;t<16;t++)0==tiles[t]&&e.push(t);if(!e.length)return;const t=e[Math.floor(Math.random()*e.length)];tiles[t]=Math.random()<.9?2:4}function draw(){for(let e=0;e<16;e++){const t=tiles[e];cells[e].textContent=t||"",cells[e].className="cell"+(t?" v"+t:"")}document.getElementById("score").textContent=score,document.getElementById("best").textContent=best}function slideLine(e){const t=e.filter(e=>0!==e),o=[];let s=0;for(let e=0;e<t.length;e++)if(t[e]===t[e+1]){const n=2*t[e];o.push(n),s+=n,e++}else o.push(t[e]);for(;o.length<4;)o.push(0);return{result:o,gained:s}}function move(e){const t=tiles.join(",");let o=0;for(let t=0;t<4;t++){const s=[];for(let o=0;o<4;o++)"left"===e&&s.push(4*t+o),"right"===e&&s.push(4*t+(3-o)),"up"===e&&s.push(4*o+t),"down"===e&&s.push(4*(3-o)+t);const n=s.map(e=>tiles[e]),{result:l,gained:r}=slideLine(n);o+=r,s.forEach((e,t)=>{tiles[e]=l[t]})}tiles.join(",")!==t&&(score+=o,score>best&&(best=score,localStorage.setItem("cosmicBest",best)),spawnTile(),draw())}document.addEventListener("keydown",e=>{const t={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"},o=t[e.key]||t[e.key.toLowerCase()];o&&(e.preventDefault(),move(o))}),spawnTile(),spawnTile(),draw()</script>

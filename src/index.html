<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Cosmic Collapse</title>
        <style>
            *{box-sizing: border-box}
            body{margin: 0;min-height:100vh;background:radial-gradient(circle at top,#253b75,#101329 65%);color: #fff;font-family: Arial,sans-serif;display:grid;place-items: center}
            main{width:min(92vw,430px);text-align:center;padding:20px 0}
            h1{font-size: clamp(30px,8vw,43px);margin:0;color: #78f4ff;text-shadow:0 0 18px #35cfff}
            p{color: #c6d6ff;margin:8px 0 20px}
            .stats{display: flex;justify-content: space-between;margin-bottom: 12px}
            .score{background:#29365d;border:1px solid #506ba3;border-radius: 12px;padding: 10px;font-weight: bold}
            #board{display: grid;grid-template-columns: repeat(4,1fr);gap:9px;padding:10px;background:#192342;border:1px solid #52689b;border-radius: 16px}
            .cell{aspect-ratio: 1;border-radius: 10px;background:#293354;display:grid;place-items: center;font-size: clamp(22px,7vw,34px);font-weight: bold}
            .v2{background:#65d9e8;color:#142440}
            .v4{background:#b2edfa;color:#142440}
            .v8{background:#ffd166;color:#382a24}
            .v16{background:#ff9d66}
            .v32{background:#ff739d}
            .v64{background:#e57cff}
            .v128{background:#9d8bff}
            .v256{background:#6e9dff}
            .v512{background:#65f0e0}
            .v1024{background:#f7f18a;color:#302a29}
            .v2048{background:#fff;color:#302a29}
        </style>
    </head>
    <body>
        <main>
            <h1>COSMIC COLLAPSE</h1>
            <div class="stats">
                <div class="score">SCORE: <span id="score">0</span></div>
                <div class="score">BEST: <span id="best">0</span></div>

            </div>
            <div id="board"></div>
            <div class="hint">Use arrow keys or W A S D </div>

        </main>
        <script>
            const board=document.querySelector("#board");
            const cells=[];
            const tiles=Array(16).fill(0);
            const scoreEl=document.querySelector("#score");
            const bestEl=document.querySelector("#best");
            let score=0,best=+(localStorage.cosmicBest||0);

            for(let i=0;i<16;i++)
        {
            cells[i]=document.createElement("div");
            cells[i].className="cell";
            board.append(cells[i]);
        }
        function spawn(){
            const empty=tiles.map((v,i)=>v?-1:i).filter(i=>i>=0);
            if(empty.length)

            tiles[empty[Math.random()*empty.length|0]]=Math.random()<.9?2:4;

        }
        function draw(){
            tiles.forEach((v,i)=>{
                cells[i].textContent=v||"";
                cells[i].className="cell"+(v?" v"+v:"");

            });
            scoreEl.textContent=score;
            bestEl.textContent=best;
        }
        function move(dir) {
            const old=tiles.join();
            let gained=0;

            for(let n=0;n<4;n++)
        {
            const ids=Array.from({length:4},(_,j)=>
        dir==="left"?n*4+j:
        dir==="right"?n*4+3-j:
        dir==="up"?j*4+n:(3-j)*4+n
       );
       const values = ids.map(i=>tiles[i]).filter(Boolean);
       const result=[];
       for(let j=0;j<values.length;j++)
       {
        if(values[j]===values[j+1]){
            result.push(values[j]*2);
            gained+=values[j]*2;
            j++;

        }else result.push(values[j]);

       }

       while(result.length<4)result.push(0);
       ids.forEach((id,j)=>tiles[id]=result[j]);

    }
    if(tiles.join()===old)return;
    score+=gained;

    if(score>best){
        best=score;
        localStorage.cosmicBest=best;
    }

    spawn();
    draw();
    if(tiles.includes(2048))alert("YOU WIN!");

        }
    document.onkeydown=e=>{
        const keys={
            arrowleft:"left",a:"left",
            arrowright:"right",d:"right",
            arrowup:"up",w:"up",
            arrowdown: "down",s:"down"
        };
        const dir=keys[e.key.toLowerCase()];
        if(dir){
            e.preventDefault();
            move(dir);
        }
    };
    bestEl.textContent=best;
    spawn();
    spawn();
    draw();
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,inital-scale=1">
        <title>Cosmic Collapse</title>
        <style>
            *{box-sizing:border-box}
            body{margin: 0;min-height: 100vh;background: radial-gradient(circle at top,#253b75,#101329 65%);color: #fff;font-family: Arial,sans-serif;display:flex;justify-content: center;align-items: center}
            main{width:min(92vw,430px);text-align:center;padding:20px 0}
            h1{font-size: clamp(30px,8vw,43px);margin:0;color:#78f4ff;text-shadow:0 0 18px #35cfff}
            p{color:#c6d6ff;margin:8px 0 20px}
            .status{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
            .score{background:#29365d;border:1px solid #506ba3;border-radius:12px;padding:10px 16px;font-weight: bold;}
            #board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:10px;background:#192342;border:1px solid #52689b;border-radius:16px;box-shadow:0 0 30px #3457a944}
            .cell{aspect-ratio:1;border-radius:10px;background:#293354;display:flex;justify-content: center;align-items:center;font-size:clamp(22px,7vw,34px);font-weight:bold;color:#fff;}
            .v2{background:#65d9e8;color:#142440}
            .v4{background:#65d9e8;color:#142e39}
            .v8{background: #ffd166;color: #382a24}
            .v16{background: #ff9d66;color: #41251e}
            .v32{background: #ff739d}
            .v64{background: #e57cff}
            .v128{background: #9d8bff}
            .v256{background: #6e9dff}
            .v512{background: #65f0e0;color:#17253d}
            .v1024{font-size: #f7f18a;color:#302a29}
            .v2048{background: #fff;color: #302a29}
            .hint{font-size:13px;line-height:1.6;margin-top:15px;color:#b9c9f6;}


        </style>

    </head>
    <body>
        <main>
            <h1>COSMIC COLLAPSE</h1>
            <p>Merge the Stars. Create a universe.</p>
            <div class="stats">
                <div class="score">SCORE: <span id="score">0</span></div>
                <div class="score">BEST: <span id="best">0</span></div>
            </div>
            <div id="board"></div>
            <div class="hint">Use arrow keys or W A S D to move<br>Combine matching planets to reach 2048!</div>
        </main>
        <script>
            const board=document.getElementById("board");
            const cells=[];
            
            for(let i=0;i<16;i++){
                const cell=document.createElement("div");
                cell.className="cell";
                board.appendChild(cell);
                cells.push(cell);

            }

            const tiles=Array(16).fill(0);

            function spawnTile(){
                const empty = [];
                for(let i=0; i<16; i++)
            {
                if(tiles[i]===0) empty.push(i);
            }

            if(empty.length === 0) return;


            
                if(empty.length===0)return;

                const spot=empty[Math.floor(Math.random()*empty.length)];
                tiles.forEach((value,index)=>{
                    cells[index].textContent=value||"";
                    cells[index].className="cell"+(value?" v"+value:"");

                });




            }
            spawnTile();
            spawnTile();
            draw();
        </script>
    </body>
</html>
